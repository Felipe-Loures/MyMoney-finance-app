<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- icon do navegador -->
    <link rel="icon" href="../assets/icon/finhub.png" type="image/png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/icon/finhub-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icon/finhub-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="../assets/icon/finhub-48.png">
    <!-- Para iPhone / iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/icon/finhub-180.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Finhub-Sistema de Gestão Financeira</title>
</head>

<body>
    <header class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom shadow-sm py-3">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="#">
                <div class="d-flex flex-column">
                    <span class="fw-bolder fs-4 lh-1 tracking-tight">My<span class="text-primary">Money</span></span>
                    <span class="badge bg-success-subtle text-success rounded-pill fw-bold p-1 mt-1"
                        style="font-size: 0.6rem;">SISTEMA ATIVO</span>
                </div>
            </a>

            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#navMyMoney">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMyMoney">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-primary px-3 rounded-3 bg-light" href="#">
                            <i class="bi bi-house-door me-1"> Home
                            </i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-secondary px-3" href="#">
                            <i class="bi bi-wallet2 me-1"></i>
                            <span>Saldo</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold text-secondary px-3" href="#">
                            <i class="bi bi-calendar-check me-1"></i>
                            <span>Movimentações</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-secondary px-3" href="#">
                            <i class="bi bi-file-earmark-text me-1">
                                Histórico
                            </i>
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3 border-top border-lg-0 pt-3 pt-lg-0">

                    <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm d-flex align-items-center gap-2"
                        onclick="document.getElementById('input-valor').focus()">
                        <i class="bi bi-plus-circle-fill">
                            Novo
                        </i>
                    </button>



                </div>
            </div>
        </div>
    </header>
</body>

</html>
