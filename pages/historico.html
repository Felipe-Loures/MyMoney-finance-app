<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyMoney - Histórico Premium</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../styles/historico.css" />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Inter", sans-serif;
      }
      .navbar {
        background-color: #0d6efd;
      }
      .transaction-card {
        transition: all 0.2s ease;
        border: 1px solid rgba(0, 0, 0, 0.01) !important;
      }
      .transaction-card:hover {
        background-color: #fcfcfc;
        transform: translateY(-3px);
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08) !important;
      }
      .icon-box {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
      }
      /* Estilo para o botão de carregar mais */
      .btn-add-more {
        background-color: #ffffff;
        border: 1px solid #dee2e6;
        color: #0d6efd;
        font-weight: 600;
        transition: all 0.2s ease;
      }
      .btn-add-more:hover {
        background-color: #f1f4f9;
        border-color: #0d6efd;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          ><i class="bi bi-wallet2 me-2"></i>MyMoney</a
        >
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto gap-2">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Resumo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="historico.html">Histórico</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container pb-5" style="max-width: 650px;">
      <div
        class="page-header mb-4 px-2 d-flex justify-content-between align-items-end"
      >
        <div>
          <small
            class="text-primary text-uppercase fw-bold"
            style="font-size: 0.65rem; letter-spacing: 1.2px;"
            >Linha do Tempo</small
          >
          <h2 class="fw-bold m-0 text-dark h4">Últimas transações</h2>
        </div>
      </div>

      <div id="lista-completa" class="d-flex flex-column gap-3 px-2">
        <div
          class="card transaction-card border-0 shadow-sm rounded-4 p-3 bg-white"
        >
          <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-box bg-success bg-opacity-10 text-success">
                <i class="bi bi-arrow-up-right fs-5"></i>
              </div>
              <div>
                <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.95rem;">
                  Freelance UI Design
                </h6>
                <div class="d-flex align-items-center gap-2">
                  <span
                    class="badge bg-light text-muted fw-normal border"
                    style="font-size: 0.65rem;"
                    >Trabalho</span
                  >
                  <small class="text-muted" style="font-size: 0.8rem;"
                    >14:30</small
                  >
                </div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <span class="fw-bold text-success" style="font-size: 1.05rem;"
                >+ R$ 1.200,00</span
              >
              <div class="dropdown">
                <i
                  class="bi bi-three-dots-vertical text-muted cursor-pointer"
                  data-bs-toggle="dropdown"
                ></i>
                <ul
                  class="dropdown-menu dropdown-menu-end border-0 shadow rounded-3"
                >
                  <li>
                    <a class="dropdown-item small" href="#"
                      ><i class="bi bi-pencil me-2"></i>Editar</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item small text-danger" href="#"
                      ><i class="bi bi-trash me-2"></i>Excluir</a
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>

        <div
          class="card transaction-card border-0 shadow-sm rounded-4 p-3 bg-white"
        >
          <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
              <div class="icon-box bg-primary bg-opacity-10 text-primary">
                <i class="bi bi-laptop fs-5"></i>
              </div>
              <div>
                <h6 class="fw-bold mb-0 text-dark" style="font-size: 0.95rem;">
                  Assinatura Adobe
                </h6>
                <div class="d-flex align-items-center gap-2">
                  <span
                    class="badge bg-light text-muted fw-normal border"
                    style="font-size: 0.65rem;"
                    >Software</span
                  >
                  <small class="text-muted" style="font-size: 0.8rem;"
                    >Ontem</small
                  >
                </div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <span class="fw-bold text-dark" style="font-size: 1.05rem;"
                >R$ 124,00</span
              >
              <i class="bi bi-three-dots-vertical text-muted"></i>
            </div>
          </div>
        </div>
      </div>

      <div class="px-2 mt-4">
        <a
          href="index.html"
          class="btn btn-white border bg-white w-100 py-3 rounded-4 shadow-sm d-flex align-items-center justify-content-center gap-2 text-primary fw-bold text-decoration-none"
        >
          <i class="bi bi-plus-circle"></i>
          Adicionar mais registros
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/historico.js"></script>
  </body>
</html>
