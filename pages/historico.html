<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMoney - Histórico</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body {
      background: #f8f9fa;
      font-family: "Inter", sans-serif;
    }

    .nav-tabs .nav-link {
      border: none !important;
      font-weight: 600;
      color: #000 !important;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-tabs .nav-link.active {
      border-bottom: 3px solid #000 !important;
    }

    .transaction-card {
      transition: all 0.2s ease;
      border: 1px solid rgba(0, 0, 0, 0.01) !important;
    }

    .transaction-card:hover {
      background: #fcfcfc;
      transform: translateY(-3px);
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08) !important;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
    }

    .text-vazio {
      text-align: center;
      color: #999;
      padding: 2rem 0;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top mb-4" style="background-color: #0d6efd;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-wallet2 me-2"></i>MyMoney</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Resumo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="historico.html">Histórico</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mb-4">
    <ul class="nav nav-tabs justify-content-center mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-todos">
          <i class="bi bi-list-ul"></i> Todos
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-ganhos">
          <i class="bi bi-arrow-up-right"></i> Ganhos
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-gastos">
          <i class="bi bi-arrow-down-left"></i> Gastos
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cofrinhos">
          <i class="bi bi-cash-stack"></i> Cofrinhos
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tab-todos">
        <div id="lista-todos" class="d-flex flex-column gap-3"></div>
      </div>
      <div class="tab-pane fade" id="tab-ganhos">
        <div id="lista-ganhos" class="d-flex flex-column gap-3"></div>
      </div>
      <div class="tab-pane fade" id="tab-gastos">
        <div id="lista-gastos" class="d-flex flex-column gap-3"></div>
      </div>
      <div class="tab-pane fade" id="tab-cofrinhos">
        <div id="lista-cofrinhos" class="d-flex flex-column gap-3"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/historico.js"></script>
</body>

</html>
