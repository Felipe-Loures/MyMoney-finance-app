<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMoney - Histórico Premium</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <style>
    :root {
      --primary-bg: #f8f9fc;
      --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
    }

    body {
      background-color: var(--primary-bg);
      font-family: 'Inter', sans-serif;
      color: #334155;
    }

    /* Navbar */
    .navbar { background: #0d6efd !important; padding: 1rem 0; }
    .nav-link {
      transition: all 0.3s;
      border-radius: 12px;
      padding: 8px 20px !important;
      color: rgba(255,255,255,0.8) !important;
    }
    .nav-link.active { background: rgba(255,255,255,0.2) !important; color: white !important; font-weight: 600; }

    /* Página */
    .page-header { margin: 40px 0; }
    .page-title { font-weight: 800; letter-spacing: -1px; color: #1e293b; }

    /* Cards */
    .transacao-card {
      border: none;
      border-radius: 24px;
      background: #ffffff;
      padding: 24px;
      box-shadow: var(--card-shadow);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      border-left: 8px solid transparent;
    }
    .transacao-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    .card-receita { border-left-color: var(--success-color); }
    .card-despesa { border-left-color: var(--danger-color); }

    /* Categoria */
    .categoria-pill {
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Valor */
    .valor-display {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 15px 0 5px 0;
      letter-spacing: -1px;
    }
    .valor-receita { color: var(--success-color); }
    .valor-despesa { color: var(--danger-color); }

    /* Texto Secundário */
    .data-texto { font-size: 0.8rem; color: #94a3b8; font-weight: 500; }
    .desc-texto {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.4;
      min-height: 40px;
    }

    /* Botão Excluir */
    .btn-delete-modern {
      background: #fff1f2;
      color: #f43f5e;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
    }
    .btn-delete-modern:hover {
      background: #f43f5e;
      color: white;
      transform: rotate(15deg);
    }

    /* Empty State */
    .empty-state {
      padding: 100px 20px;
      text-align: center;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">MyMoney</a>
      <button
        class="navbar-toggler border-0"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Resumo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="historico.html">Histórico</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="page-header d-flex justify-content-between align-items-center">
      <div>
        <h2 class="page-title m-0">Movimentações</h2>
      </div>
      <button class="btn btn-outline-danger rounded-pill px-4" onclick="limparTudo()">
        <i class="bi bi-trash3 me-2"></i>Limpar Tudo
      </button>
    </div>

    <div id="lista-completa" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/historico.js"></script>

   
</body>
</html>
