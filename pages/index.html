<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyMoney - Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="../styles/home.css" />
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top mb-5">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">MyMoney</a>
      <button
        class="navbar-toggler border-0 shadow-none"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item">
            <a class="nav-link active" href="index.html">Resumo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="historico.html">Histórico</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- TÍTULO DOS INDICADORES -->
    <div class="row mb-3">
      <div class="col-12">
        <h3 class="fw-bold text-center mb-4">Resumo Financeiro</h3>
      </div>
    </div>

    <!-- CARDS DE INDICADORES -->
    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="card-resumo border-saldo">
          <div class="icon-box bg-primary bg-opacity-10 text-primary">
            <i class="bi bi-bank"></i>
          </div>
          <small class="form-label-custom">Saldo Total</small>
          <h2 class="fw-extrabold m-0" id="resumo-saldo" style="font-weight: 800;">
            R$ 0,00
          </h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-resumo border-ganho">
          <div class="icon-box bg-success bg-opacity-10 text-success">
            <i class="bi bi-arrow-up-right-circle"></i>
          </div>
          <small class="form-label-custom" style="color: var(--success-green);">Ganhos</small>
          <h2 class="fw-extrabold m-0 text-success" id="resumo-receitas" style="font-weight: 800;">
            R$ 0,00
          </h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-resumo border-gasto">
          <div class="icon-box bg-danger bg-opacity-10 text-danger">
            <i class="bi bi-arrow-down-left-circle"></i>
          </div>
          <small class="form-label-custom" style="color: var(--danger-red);">Gastos</small>
          <h2 class="fw-extrabold m-0 text-danger" id="resumo-despesas" style="font-weight: 800;">
            R$ 0,00
          </h2>
        </div>
      </div>
    </div>

    <!-- FORMULÁRIO DE NOVO LANÇAMENTO -->
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card-form p-4 p-md-5 mb-4">
          <h4 class="fw-bold mb-4">
            <i class="bi bi-plus-circle me-2"></i>Novo Lançamento
          </h4>
          <form id="transacao-form">
            <div class="row g-4">
              <div class="col-md-3">
                <label class="form-label-custom">Valor (R$)</label>
                <input
                  type="number"
                  id="input-valor"
                  class="form-control form-control-custom"
                  placeholder="0,00"
                  step="0.01"
                  required
                />
              </div>
              <div class="col-md-3">
                <label class="form-label-custom">Tipo</label>
                <select
                  id="input-tipo"
                  class="form-select form-control-custom"
                  required
                >
                  <option value="" disabled selected>Selecione...</option>
                  <option value="receita">💰 Ganho (Entrada)</option>
                  <option value="despesa">💸 Gasto (Saída)</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label-custom">Categoria</label>
                <select
                  id="input-categoria"
                  class="form-select form-control-custom"
                  required
                >
                  <option value="" disabled selected>O que é?</option>
                  <option value="Salário">💼 Salário</option>
                  <option value="Extra">🌟 Extra</option>
                  <option value="Alimentação">🍕 Alimentação</option>
                  <option value="Moradia">🏠 Moradia</option>
                  <option value="Lazer">🍿 Lazer</option>
                  <option value="Transporte">🚗 Transporte</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label-custom">Descrição</label>
                <input
                  type="text"
                  id="input-descricao"
                  class="form-control form-control-custom"
                  placeholder="Ex: Pix do Job"
                />
              </div>
              <div class="col-12 mt-4">
                <button
                  type="submit"
                  class="btn btn-primary btn-salvar w-100 shadow-sm"
                >
                  <i class="bi bi-check2-circle me-2"></i>CONFIRMAR LANÇAMENTO
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- BOTÃO PARA HISTÓRICO -->
    <div class="text-center pb-5">
      <a href="historico.html" class="btn-historico">
        VER HISTÓRICO COMPLETO <i class="bi bi-arrow-right ms-1"></i>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
