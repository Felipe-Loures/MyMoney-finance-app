<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMoney</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .animate-logo {
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>

<body class="bg-primary vh-100 d-flex flex-column align-items-center justify-content-center text-white text-center p-4">

    <div class="flex-grow-1 d-flex align-items-center">
        <img src="assets/icon/mymoney.png" class="img-fluid animate-logo" style="max-height: 250px;">
    </div>

    <div id="loader" class="w-100 mb-5" style="max-width: 300px;">
        <div class="progress rounded-pill bg-white bg-opacity-25" style="height: 8px;">
            <div id="bar" class="progress-bar bg-white progress-bar-striped progress-bar-animated" style="width: 0%">
            </div>
        </div>
        <p class="mt-2 small opacity-50 fw-bold text-uppercase">Iniciando...</p>
    </div>

    <div id="exit" class="d-none mb-5 text-center">
        <h2 class="fw-bold mb-4">Até breve!</h2>
        <a href="pages/app.html" class="btn btn-light btn-lg rounded-pill px-5 fw-bold text-primary shadow">ACESSAR
            DASHBOARD</a>
    </div>

    <script>
        const isLogout = new URLSearchParams(location.search).get('logout') === 'true';
        const bar = document.getElementById('bar');

        if (isLogout) {
            document.getElementById('loader').classList.add('d-none');
            document.getElementById('exit').classList.remove('d-none');
        } else {
            let w = 0;
            const iv = setInterval(() => {
                w++;
                bar.style.width = w + '%';
                if (w >= 100) { clearInterval(iv); location.href = "pages/app.html"; }
            }, 50);
        }
    </script>
</body>

</html>
