<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MyMoney - Histórico</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="icon" href="../assets/icon/mymoney.png">

<style>

body{
  background:#f8f9fa;
  font-family:"Inter",sans-serif;
}

/* Tabs */

.nav-tabs{
  border-bottom:1px solid #eee;
}

.nav-tabs .nav-link{
  border:none;
  font-weight:600;
  color:#000;
  background:transparent;
  display:flex;
  align-items:center;
  gap:.5rem;
  padding:1rem;
}

.nav-tabs .nav-link.active{
  border-bottom:3px solid #000;
}

/* Transaction Card */

.transaction-card{
  border:1px solid rgba(0,0,0,0.05);
  transition:all .2s ease;
}

.transaction-card:hover{
  transform:translateY(-2px);
  box-shadow:0 .5rem 1rem rgba(0,0,0,.08);
}

/* Icon */

.icon-box{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  flex-shrink:0;
}

/* Descrição */

.texto-descricao{
  max-width:180px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Responsivo */

@media (max-width:576px){

.texto-descricao{
  max-width:120px;
}

.nav-tabs .nav-link{
  font-size:.85rem;
  padding:.8rem .5rem;
}

}

/* Lista vazia */

.text-vazio{
  text-align:center;
  color:#999;
  padding:3rem 0;
  font-weight:600;
}

</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top mb-4">

<div class="container">

<a class="navbar-brand fw-bold" href="app.html">
  <i class="bi bi-wallet2 me-2"></i>MyMoney
</a>

<button
class="navbar-toggler border-0 shadow-none"
data-bs-toggle="collapse"
data-bs-target="#navbarNav">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="navbarNav">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="app.html">Resumo</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="historico.html">Histórico</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container mb-4">

<ul class="nav nav-tabs justify-content-center mb-4">

<li class="nav-item">
<button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-todos">
<i class="bi bi-list-ul"></i> Todos
</button>
</li>

<li class="nav-item">
<button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-ganhos">
<i class="bi bi-arrow-up-right"></i> Ganhos
</button>
</li>

<li class="nav-item">
<button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-gastos">
<i class="bi bi-arrow-down-left"></i> Gastos
</button>
</li>

<li class="nav-item">
<button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cofrinhos">
<i class="bi bi-piggy-bank"></i> Cofrinhos
</button>
</li>

</ul>

<div class="tab-content">

<div class="tab-pane fade show active" id="tab-todos">
<div id="lista-todos" class="d-flex flex-column gap-2"></div>
</div>

<div class="tab-pane fade" id="tab-ganhos">
<div id="lista-ganhos" class="d-flex flex-column gap-2"></div>
</div>

<div class="tab-pane fade" id="tab-gastos">
<div id="lista-gastos" class="d-flex flex-column gap-2"></div>
</div>

<div class="tab-pane fade" id="tab-cofrinhos">
<div id="lista-cofrinhos" class="d-flex flex-column gap-2"></div>
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/script.js"></script>
<script src="../js/historico.js"></script>

</body>
</html>
